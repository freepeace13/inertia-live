name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Inertia 3 requires React 19.
          - { inertia: '^2', react: '^19' }
          - { inertia: '^3', react: '^19' }
          - { inertia: '^2', react: '^18' }
    name: Client / Inertia ${{ matrix.inertia }} / React ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pin the matrix versions in the workspaces that own them, then resolve without the
      # lockfile so each combination installs exactly one copy of React.
      - run: >
          npm pkg set
          -w @freepeace13/inertia-live-react
          "devDependencies.@inertiajs/react=${{ matrix.inertia }}"
          "devDependencies.react=${{ matrix.react }}"
          "devDependencies.react-dom=${{ matrix.react }}"
          "devDependencies.@types/react=${{ matrix.react }}"
          "devDependencies.@types/react-dom=${{ matrix.react }}"
      - run: npm pkg set -w @freepeace13/inertia-live-vue "devDependencies.@inertiajs/vue3=${{ matrix.inertia }}"
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  demo:
    runs-on: ubuntu-latest
    name: Demo app
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the client packages the demo links to
        working-directory: .
        run: npm ci && npm run build
      - run: cp .env.example .env && touch database/database.sqlite
      - run: composer install --prefer-dist --no-interaction
      - run: php artisan key:generate
      - run: npm install
      - run: npm run build
      - run: php artisan test
      - name: End-to-end (Reverb round trip and two real browser tabs, Vue and React)
        run: |
          npx playwright install --with-deps chromium
          php artisan reverb:start --port=8080 &
          php artisan serve --port=8000 &
          # Wait for both servers instead of sleeping a fixed time.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && nc -z localhost 8080 && break
            sleep 1
          done
          npm run e2e
          npm run e2e:browser
