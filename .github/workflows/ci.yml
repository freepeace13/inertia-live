name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Inertia 3 requires React 19. Inertia applies to both the React and Vue adapters.
          - { inertia: '^2', react: '^19', node: 22 }
          - { inertia: '^3', react: '^19', node: 22 }
          - { inertia: '^2', react: '^18', node: 22 }
          # The lowest supported versions of everything, to prove the range at its edge (D-024).
          - { inertia: '~2.0.0', react: '^18', node: 22, lowest: true }
    name: Client / Inertia ${{ matrix.inertia }} / React ${{ matrix.react }} / Node ${{ matrix.node }}${{ matrix.lowest && ' / lowest' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Pin the matrix versions in the workspace catalog, then resolve without the lockfile
      # so each combination installs exactly one copy of React.
      - run: |
          sed -i -E \
            -e "s#^(  '@inertiajs/react':) .*#\1 ${{ matrix.inertia }}#" \
            -e "s#^(  '@inertiajs/vue3':) .*#\1 ${{ matrix.inertia }}#" \
            -e "s#^(  '@types/react(-dom)?':) .*#\1 ${{ matrix.react }}#" \
            -e "s#^(  react(-dom)?:) .*#\1 ${{ matrix.react }}#" \
            pnpm-workspace.yaml
      - if: matrix.lowest
        run: |
          sed -i -E \
            -e "s#^(  vue:) .*#\1 3.4.0#" \
            -e "s#^(  laravel-echo:) .*#\1 2.0.0#" \
            pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  package-shape:
    runs-on: ubuntu-latest
    name: Package shape
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-package-shape.mjs
      # ESM-only packages: the CommonJS and node10 resolutions are expected to fail.
      - run: |
          for package in core vue react; do
            npx --yes publint@0.3.25 packages/$package --strict
            npx --yes @arethetypeswrong/cli@0.18.5 --pack packages/$package --profile esm-only
          done
