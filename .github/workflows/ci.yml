name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Inertia 3 requires React 19. Inertia applies to both the React and Vue adapters.
          - { inertia: '^2', react: '^19', node: 22 }
          - { inertia: '^3', react: '^19', node: 22 }
          - { inertia: '^2', react: '^18', node: 22 }
          # Lowest supported Inertia 2 with React 18.
          - { inertia: '~2.0.0', react: '^18', node: 22 }
          # Oldest supported Node. The React tests run on jsdom, which needs Node 22+, so
          # this cell tests the packages that do not (core and Vue).
          - { inertia: '^2', react: '^19', node: 20, tests: 'core,vue' }
    name: Client / Inertia ${{ matrix.inertia }} / React ${{ matrix.react }} / Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Pin the matrix versions in the workspace catalog, then resolve without the lockfile
      # so each combination installs exactly one copy of React.
      - run: |
          sed -i -E \
            -e "s#^(  '@inertiajs/react':) .*#\1 ${{ matrix.inertia }}#" \
            -e "s#^(  '@inertiajs/vue3':) .*#\1 ${{ matrix.inertia }}#" \
            -e "s#^(  '@types/react(-dom)?':) .*#\1 ${{ matrix.react }}#" \
            -e "s#^(  react(-dom)?:) .*#\1 ${{ matrix.react }}#" \
            pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter "./tests/{${{ matrix.tests || 'core,vue,react' }}}" test
