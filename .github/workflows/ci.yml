name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Inertia 3 requires React 19.
          - { inertia: '^2', react: '^19' }
          - { inertia: '^3', react: '^19' }
          - { inertia: '^2', react: '^18' }
    name: Client / Inertia ${{ matrix.inertia }} / React ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Pin the matrix versions in the workspace catalog, then resolve without the lockfile
      # so each combination installs exactly one copy of React.
      - run: |
          sed -i -E \
            -e "s#^(  '@inertiajs/react':) .*#\1 ${{ matrix.inertia }}#" \
            -e "s#^(  '@types/react(-dom)?':) .*#\1 ${{ matrix.react }}#" \
            -e "s#^(  react(-dom)?:) .*#\1 ${{ matrix.react }}#" \
            pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
